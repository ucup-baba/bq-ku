<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F231F">
<title>Offline — BQ-ku</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root { --bg: #FBFAF5; --kartu: #FFFFFF; --tinta: #152A26; --redup: #5B6B66; --garis: #E5E1D8; --hijau: #0E9F54; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0C1917; --kartu: #12201D; --tinta: #E8EFEC; --redup: #93A39E; --garis: #22342F; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--bg); color: var(--tinta); font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 380px; text-align: center; background: var(--kartu); border: 1px solid var(--garis);
    border-radius: 28px; padding: 32px 24px; box-shadow: 0 10px 30px -18px rgb(0 0 0 / .35); }
  img { width: 72px; height: 72px; border-radius: 20px; }
  h1 { font-size: 20px; margin: 18px 0 6px; font-weight: 800; }
  p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--redup); }
  button { margin-top: 22px; width: 100%; height: 48px; border: 0; border-radius: 16px; background: var(--hijau);
    color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  button:active { scale: .97; }
  small { display: block; margin-top: 14px; font-size: 12px; color: var(--redup); }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Kamu sedang offline</h1>
  <p>Halaman ini butuh sinyal untuk memuat data terbaru. Isian form yang belum terkirim tetap aman tersimpan sebagai draf di HP ini.</p>
  <button type="button" onclick="location.reload()">Coba lagi</button>
  <small>Halaman akan dimuat ulang otomatis begitu sinyal kembali.</small>
</main>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
